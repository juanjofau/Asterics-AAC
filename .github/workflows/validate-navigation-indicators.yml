name: Validate navigation indicator changes

on:
  push:
    branches:
      - navigation-indicator-styles

permissions:
  contents: read

jobs:
  test-and-build:
    name: Run tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Prepare test version constants
        run: |
          sed -i "s/#ASTERICS_GRID_VERSION#/validation-${GITHUB_RUN_NUMBER}/g" src/js/util/constants.js src/vue-components/views/aboutView.vue serviceWorker.js
          sed -i 's/#ASTERICS_GRID_ENV#/BETA/g' src/js/util/constants.js

      - name: Run Jest tests and Webpack build
        run: npm run build
