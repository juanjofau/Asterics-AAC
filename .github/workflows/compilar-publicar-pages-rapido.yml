name: Compilar y publicar en GitHub Pages (rápido)

# Solo se ejecuta manualmente.
on:
  workflow_dispatch:
    inputs:
      rama:
        description: "Rama a publicar (vacío = rama seleccionada arriba)"
        required: false
        default: ""
        type: string

# Evita dos publicaciones simultaneas.
concurrency:
  group: publicacion-pages
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar rama seleccionada
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    steps:
      # Descargar el codigo de la rama elegida.
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama }}

      # Misma version de Node que el build original.
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Reutilizar las dependencias instaladas entre ejecuciones.
      - name: Restaurar dependencias
        id: dependencies-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package.json', 'yarn.lock') }}

      - name: Instalar dependencias
        if: steps.dependencies-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund --prefer-offline --package-lock=false

      # Reutilizar trabajo de compilacion de Webpack.
      - name: Restaurar cache Webpack
        uses: actions/cache@v4
        with:
          path: .webpack-cache
          key: webpack-${{ runner.os }}-node22-${{ hashFiles('package.json', 'yarn.lock', 'webpack.config.js') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            webpack-${{ runner.os }}-node22-${{ hashFiles('package.json', 'yarn.lock', 'webpack.config.js') }}-

      # Preparar constantes como en la compilacion Beta.
      - name: Configurar version de prueba
        run: |
          sed -i "s/#ASTERICS_GRID_VERSION#/pages-${GITHUB_RUN_NUMBER}/g" src/js/util/constants.js src/vue-components/views/aboutView.vue serviceWorker.js
          sed -i 's/#ASTERICS_GRID_ENV#/BETA/g' src/js/util/constants.js
          sed -i 's/constants.FORCE_USE_SW = false;/constants.FORCE_USE_SW = true;/' src/js/util/constants.js

      # Compilar sin ejecutar Jest.
      - name: Compilar aplicacion
        run: |
          ./node_modules/.bin/webpack --config webpack.config.js --env production --cache-type filesystem --cache-cache-directory .webpack-cache
          node scripts/getServiceWorkerCachePaths.js

      # Preparar solo los archivos necesarios para la web.
      - name: Preparar archivos para publicar
        run: |
          mkdir -p public
          cp index.html unsupported.html public/
          cp serviceWorker.js serviceWorkerCachePaths.js public/
          cp -R app public/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir web compilada
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  publicar:
    name: Publicar web
    needs: compilar
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
